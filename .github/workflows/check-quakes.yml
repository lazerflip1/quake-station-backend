name: Check Earthquakes
on:
  schedule:
    - cron: '*/10 * * * *' # Runs automatically every 10 minutes for free
  workflow_dispatch: # Allows you to trigger it manually via the GitHub UI

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Create Key File
        run: echo '${{ secrets.FIREBASE_KEY }}' > quake-station-firebase-adminsdk-fbsvc-a63034f825.json

      - name: Execute Broadcast
        run: node broadcast.js
